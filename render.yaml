services:
  - type: web
    name: community-events
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: community-events-db
          property: connectionString

databases:
  - name: community-events-db
    databaseName: community_events
    user: community_events
    plan: free
